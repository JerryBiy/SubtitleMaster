<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Subtitles+</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="wrap">
      <div class="topbar">
        <h1>Subtitles+</h1>
        <div id="spinner" class="spinner hidden" aria-label="Loading"></div>
      </div>

      <div id="onboarding" class="card hidden">
        <div class="cardTitle">Quick start</div>
        <ul class="bullets">
          <li>
            Open a Netflix video page (<span class="mono">/watch/…</span>).
          </li>
          <li>
            Upload an <span class="mono">.srt</span> or
            <span class="mono">.vtt</span> file.
          </li>
          <li>
            Sync with <span class="mono">[</span> /
            <span class="mono">]</span> (±250ms),
            <span class="mono">\</span> resets.
          </li>
        </ul>
        <div class="hint">
          If you ever see connection issues, try reloading Netflix.
        </div>
      </div>

      <div class="row grid2">
        <button id="reloadNetflixBtn" class="secondary">Reload Netflix</button>
        <button id="helpBtn" class="secondary">Help</button>
      </div>

      <div class="row">
        <label class="label">Language label</label>
        <!-- Language label removed -->
      </div>

      <div class="row">
        <label class="label">Load subtitles (.srt/.vtt)</label>
        <input
          id="fileInput"
          type="file"
          accept=".srt,.vtt,text/vtt,text/plain"
        />
        <button
          id="clearSubtitleBtn"
          class="secondary"
          style="margin-top: 8px; width: 100%"
        >
          Clear Subtitles
        </button>
        <div id="fileStatus" class="hint">No file loaded</div>
      </div>

      <div class="row grid2">
        <button id="enableBtn">Enable</button>
        <button id="disableBtn" class="secondary">Disable</button>
      </div>

      <hr />

      <div class="row">
        <label class="label">Offset (ms)</label>
        <input id="offsetMs" type="number" step="50" />
        <button
          id="resetOffsetBtn"
          class="secondary"
          style="margin-top: 8px; width: 100%"
        >
          Reset Offset
        </button>
        <div class="hint">
          Hotkeys: [ -250ms, ] +250ms, \ reset — Current:
          <span id="offsetVal">0</span> ms
        </div>
      </div>

      <div class="row">
        <label class="label">Font size (px)</label>
        <input id="fontSizePx" type="range" min="16" max="72" step="1" />
        <div class="hint"><span id="fontSizeVal"></span> px</div>
      </div>

      <div class="row">
        <label class="label">Bottom position (px)</label>
        <input id="bottomPx" type="range" min="20" max="220" step="1" />
        <div class="hint"><span id="bottomVal"></span> px</div>
      </div>

      <div class="row">
        <label class="label">Background opacity</label>
        <input id="bgOpacity" type="range" min="0" max="0.85" step="0.05" />
        <div class="hint"><span id="bgVal"></span></div>
      </div>

      <!-- Save scope removed: settings are saved per-title by default -->

      <div id="status" class="status"></div>
      <div id="smallStatus" class="smallStatus"></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
